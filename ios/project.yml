name: ApexCoach
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
targets:
  ApexCoach:
    type: application
    platform: iOS
    sources:
      - ApexCoach
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: APEX Coaching Platform
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: "Used to scan food barcodes for nutrition tracking."
        NSPhotoLibraryUsageDescription: "Used to attach and upload photos within the app (progress photos, messages)."
        NSPhotoLibraryAddUsageDescription: "Used to save photos from the app to your library."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexcoaching.platform
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ApexCoach/ApexCoach.entitlements
