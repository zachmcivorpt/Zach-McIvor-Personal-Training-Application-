# The iPhone app WITH the Apple Watch app (REGRESSION_TESTS.md #189).
# Codemagic generates from this file when the APEX_WATCH variable is "true"
# (codemagic.yaml), otherwise from project.yml alone, so builds keep working
# until the Watch App ID and its App Store profile exist:
#   App ID: com.apexcoaching.platform.watchkitapp with HealthKit ticked (#262)
#   Profile: App Store, for that App ID, available to Codemagic.
# Keep the Watch app's version in step with the iPhone app's (project.yml).
include:
  - project.yml
targets:
  ApexCoach:
    dependencies:
      - target: ApexWatch
  ApexWatch:
    type: application
    platform: watchOS
    # watchOS 8 = Series 3's last version; keep it running there (#305).
    deploymentTarget: "8.0"
    sources:
      - path: ApexWatch
        excludes:
          - "*.entitlements"
    dependencies:
      - sdk: HealthKit.framework
    info:
      path: ApexWatch-Info.plist
      properties:
        CFBundleDisplayName: APEX
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.apexcoaching.platform
        ITSAppUsesNonExemptEncryption: false
        # Apple Health workout while a workout runs on the iPhone (#262).
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "APEX reads your heart rate and active energy during a workout to show your live heart rate on your Apple Watch."
        NSHealthUpdateUsageDescription: "APEX saves your strength workouts, with the heart rate and active energy your Apple Watch measures, to Apple Health so they count toward your Activity rings."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexcoaching.platform.watchkitapp
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ApexWatch/ApexWatch.entitlements
