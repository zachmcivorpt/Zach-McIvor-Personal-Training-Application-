<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>APEX Coaching Platform</title>
    <meta name="description" content="APEX Coaching Platform — train, nutrition, lifestyle, performance." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="APEX" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- A coach's app opens dark (src/App.jsx's splash and console): paint
         the page dark before any script loads so a cold open doesn't flash
         white first. Reads the profile AppContext keeps on the phone. -->
    <script>
      try {
        if ((JSON.parse(localStorage.getItem("apexProfileCache") || "null") || {}).role === "coach") {
          document.documentElement.style.backgroundColor = "#090909";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
