workflows:
  ios-workflow:
    name: APEX Coaching Platform - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: APEX
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.apexcoaching.platform
      vars:
        BUNDLE_ID: "com.apexcoaching.platform"
        XCODE_PROJECT: "ApexCoach.xcodeproj"
        XCODE_SCHEME: "ApexCoach"
      xcode: latest
    scripts:
      - name: Install xcodegen
        script: |
          brew install xcodegen
      - name: Generate Xcode project from ios/project.yml
        script: |
          cd ios && xcodegen generate
      - name: Set up code signing (using the stored APEX certificate + profile)
        script: |
          xcode-project use-profiles
      - name: Increment build number to match Codemagic build
        script: |
          cd ios && agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Build .ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "ios/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: APEX Coaching Platform - Android
    max_build_duration: 30
    instance_type: linux_x2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      vars:
        PACKAGE_NAME: "com.apexcoaching.platform"
      groups:
        - android_signing
      node: latest
    scripts:
      - name: Point Bubblewrap at Codemagic's pre-installed JDK + Android SDK
        script: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
      - name: Restore the signing keystore from the encrypted env var
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/android.keystore
      - name: Build the signed Android App Bundle
        script: |
          cd android && npx --yes @bubblewrap/cli build
    artifacts:
      - android/app-release-bundle.aab

