# One-off (owner, 2026-11-20): empty the restore-1120 backup copy now the
# client is restored (the admin key can't delete a database; an empty one
# stores nothing, so costs nothing). Runs only on pushes to this branch.
name: Delete restore copy (one-off)
on:
  push:
    branches: [claude/fitness-app-ui-oa3o5k]
    paths: [".github/workflows/delete-restore-db.yml"]
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"
      - name: Empty restore-1120
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          mkdir -p "$RUNNER_TEMP/d" && cd "$RUNNER_TEMP/d" && npm init -y >/dev/null && npm i firebase-admin@12 --silent
          cat > d.mjs <<'JS'
          import { initializeApp } from "firebase-admin/app";
          import { getFirestore } from "firebase-admin/firestore";
          const db = getFirestore(initializeApp({ projectId: "zach-mcivor-pt-app" }), "restore-1120");
          const cols = await db.listCollections();
          for (const c of cols) { await db.recursiveDelete(c); console.log("emptied", c.id); }
          console.log("left:", (await db.listCollections()).length, "collections");
          process.exit(0);
          JS
          node d.mjs
