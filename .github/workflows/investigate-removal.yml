# One-off (owner, 2026-11-20): find out which device/browser made the
# deleteClientAuthAccount call that removed a client at 16:11 AEDT, and
# whether Firestore point-in-time recovery / backups are on. Read-only.
name: Investigate client removal (one-off)
on:
  push:
    branches: [claude/fitness-app-ui-oa3o5k]
    paths: [".github/workflows/investigate-removal.yml"]
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q
          gcloud config set project zach-mcivor-pt-app -q
      - name: Every deleteClientAuthAccount call (last 30 days)
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="deleteclientauthaccount" AND httpRequest.requestMethod="POST"' \
            --freshness=30d --limit=50 \
            --format='table(timestamp,httpRequest.status,httpRequest.userAgent,httpRequest.remoteIp.sub("\.[0-9]+$",".x"),httpRequest.referer)'
      - name: Every function call 16:00–16:20 AEDT (05:00–05:20 UTC) on 2026-11-20
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.requestMethod="POST" AND timestamp>="2026-11-20T05:00:00Z" AND timestamp<="2026-11-20T05:20:00Z"' \
            --limit=200 --order=asc \
            --format='table(timestamp,resource.labels.service_name,httpRequest.status,httpRequest.userAgent,httpRequest.remoteIp.sub("\.[0-9]+$",".x"))'
      - name: Any text logged by the function that day
        continue-on-error: true
        run: |
          gcloud logging read 'resource.labels.service_name="deleteclientauthaccount" AND timestamp>="2026-11-20T00:00:00Z" AND timestamp<="2026-11-21T00:00:00Z"' \
            --limit=50 --format='table(timestamp,severity,textPayload,jsonPayload.message)'
      - name: Auth admin activity that day (deleteUser)
        continue-on-error: true
        run: |
          gcloud logging read 'protoPayload.serviceName="identitytoolkit.googleapis.com" AND timestamp>="2026-11-20T00:00:00Z" AND timestamp<="2026-11-21T00:00:00Z"' \
            --limit=50 --format='table(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail)'
      - name: Firestore recovery settings
        continue-on-error: true
        run: |
          gcloud firestore databases describe --database='(default)' --format='yaml(pointInTimeRecoveryEnablement,deleteProtectionState,versionRetentionPeriod,earliestVersionTime)'
          gcloud firestore backups schedules list --database='(default)' || true
          gcloud firestore databases list --format='table(name,createTime)' || true
