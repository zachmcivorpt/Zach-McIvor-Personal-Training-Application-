name: Codemagic builds

# Read-only: lists the latest Codemagic builds (status, build number,
# commit, TestFlight upload) in the run's summary (scripts/codemagic-builds.cjs).
# Needs the CODEMAGIC_API_TOKEN repo secret. Run by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List builds
        run: node scripts/codemagic-builds.cjs
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
